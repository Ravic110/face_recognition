name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances de test
        # dlib et face_recognition ne sont pas installés : la comparaison de
        # visages vit dans domain/matching.py en numpy pur, et le moteur de
        # reconnaissance sera mocké à la frontière face_matcher.
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.4.4 \
            opencv-python-headless==4.13.0.92 \
            Pillow==12.2.0 \
            flask==3.1.3 \
            requests==2.33.1 \
            pytest==9.0.2 \
            ruff==0.9.6 \
            mypy==1.15.0

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types (domaine et configuration)
        run: mypy

      - name: Tests
        run: pytest
